# Supabase CLI configuration for LOCAL development (`supabase start`).
# Hosted projects are configured in the Supabase Dashboard — see DEPLOYMENT.md.

project_id = "beautyexpress"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local email testing inbox (password reset emails appear here): http://localhost:54324
[local_smtp]
enabled = true
port = 54325

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Locally, accounts work immediately. In production turn confirmations ON (DEPLOYMENT.md).
enable_confirmations = false

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_refresh = 150

# Stripe cannot send a Supabase login token, so the webhook verifies the
# Stripe signature instead.
[functions.stripe-webhook]
verify_jwt = false

# Scheduled jobs call these with the x-cron-secret header (or an admin session);
# each function checks that itself.
[functions.send-notification]
verify_jwt = false

[functions.release-payouts]
verify_jwt = false

[functions.process-refund]
verify_jwt = false

[functions.create-payment-intent]
verify_jwt = true

[functions.cancel-booking]
verify_jwt = true

[functions.stripe-connect]
verify_jwt = true
